# Production: the app behind Caddy with automatic HTTPS, plus a daily database backup.
#   cp .env.example .env   # fill in DOMAIN, SUPER_PASSWORD and the rest
#   docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/putevka.db
      PUBLIC_URL: https://${DOMAIN:?укажите DOMAIN в .env}
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
    volumes:
      - data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup:
    build: .
    restart: unless-stopped
    command: ["node", "scripts/backup.mjs", "--every", "24h"]
    environment:
      DB_PATH: /app/data/putevka.db
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: "14"
    volumes:
      - data:/app/data
      - backups:/app/backups
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?укажите ACME_EMAIL в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
